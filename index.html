<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLAYMATE - Horror Multiplayer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/6.41.0/babylon.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="glitch-title" data-text="PLAYMATE">PLAYMATE</div>
        <button id="btn-login-google" class="btn-horror">LOGIN WITH GOOGLE</button>
    </div>

    <div id="lobby-screen" class="screen">
        <div class="header-profile">
            <img id="user-avatar" src="https://via.placeholder.com/50" alt="Avatar">
            <div>
                <h3 id="user-username">Memuat...</h3>
                <p>Level: <span id="user-level">1</span></p>
            </div>
        </div>
        <div class="lobby-actions">
            <button id="btn-quick-match" class="btn-horror">QUICK MATCH</button>
            <div class="create-room-box">
                <button id="btn-create-room" class="btn-horror">CREATE ROOM</button>
                <input type="text" id="input-room-code" placeholder="KODE ROOM">
                <button id="btn-join-room" class="btn-horror">JOIN</button>
            </div>
        </div>
    </div>

    <div id="room-screen" class="screen">
        <h2>ROOM: <span id="room-id-display">------</span></h2>
        <div id="player-list" class="player-grid">
            </div>
        <div class="room-actions">
            <button id="btn-start-game" class="btn-horror">START GAME</button>
            <button id="btn-leave" class="btn-horror">KELUAR</button>
        </div>
    </div>

    <div id="game-container" class="screen">
        <canvas id="renderCanvas"></canvas>

        <div id="mobile-command-trigger" class="mobile-only">
            <button id="btn-mobile-chat">💬 COMMAND</button>
        </div>

        <div id="command-box" class="hidden">
            <input type="text" id="input-command" placeholder="Ketik pesan/perintah (Tekan Enter)...">
        </div>

        <div id="glitch-overlay" class="glitch-overlay hidden">
            <div id="glitch-text-1" class="text-large"></div>
            <div id="glitch-text-2" class="text-status"></div>
            <div id="glitch-objective" class="text-sub"></div>
        </div>

        <div id="cctv-ui" class="hidden">
            <div class="cctv-header">REC <span id="cctv-cam-name">CAM 01</span></div>
            <button id="btn-next-cam" class="btn-horror">NEXT CAM</button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
